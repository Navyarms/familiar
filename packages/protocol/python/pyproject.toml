[project]
name = "familiar-protocol"
version = "0.1.0"
description = "Shell <-> Brain message types for Familiar (source of truth; JSON schema and TS are generated from here)."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["familiar_protocol"]

[project]
name = "familiar-brain"
version = "0.1.0"
description = "Familiar's local brain: LLM, TTS, STT, tools, memory. Talks to the Electron shell over a local WebSocket."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "httpx>=0.27",
  "pydantic>=2.7",
  "kokoro-onnx>=0.6.1",
  "numpy>=1.26",
  "psutil>=5.9",
  "familiar-protocol",
]

[project.scripts]
familiar-brain = "familiar_brain.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "pyinstaller>=6.10"]

[tool.uv.sources]
familiar-protocol = { path = "../packages/protocol/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["familiar_brain"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

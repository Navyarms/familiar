[project]
name = "familiar-brain"
version = "0.1.1"
description = "Familiar's local brain: LLM, TTS, STT, tools, memory. Talks to the Electron shell over a local WebSocket."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
  "httpx>=0.27",
  "pydantic>=2.7",
  "kokoro-onnx>=0.6.1",
  "numpy>=1.26",
  "psutil>=5.9",
  "familiar-protocol",
  "sherpa-onnx>=1.13.8",
  "faster-whisper>=1.2.1",
  "sounddevice>=0.5.6",
  "sentencepiece>=0.2.2",
  "sherpa-onnx-core>=1.13.8",
  "pycaw>=20260927",
  "uiautomation>=2.0.29",
  "pillow>=13.0.0",
  "mss>=10.2.0",
]

[project.scripts]
familiar-brain = "familiar_brain.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyinstaller>=6.10",
    "pytest-timeout>=2.4.0",
]

[tool.uv.sources]
familiar-protocol = { path = "../packages/protocol/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["familiar_brain"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
